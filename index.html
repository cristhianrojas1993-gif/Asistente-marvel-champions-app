<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marvel Champions Companion</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-3 flex flex-col justify-between font-sans select-none">

  <!-- ENCABEZADO -->
  <header class="flex justify-between items-center py-2 border-b border-slate-800">
    <div>
      <h1 class="text-xl font-black tracking-wider text-red-500 uppercase">Marvel Champions</h1>
      <p class="text-[10px] text-slate-400 font-semibold tracking-wide">Companion App v5.1</p>
    </div>
    
    <div class="flex gap-1.5">
      <div class="relative">
        <button onclick="toggleMenuConfig()" class="bg-slate-800 border border-slate-700 px-3 py-1.5 rounded-xl text-xs font-bold text-slate-200">⚙️</button>
        <div id="dropdown-config" class="hidden absolute right-0 mt-2 w-48 bg-slate-800 border border-slate-700 rounded-2xl shadow-2xl z-50 p-2 space-y-1">
          <button onclick="reiniciarPartida()" class="w-full text-left px-3 py-2 text-xs font-bold text-red-400 hover:bg-slate-700 rounded-xl transition">🔄 Reiniciar Partida</button>
        </div>
      </div>
      <button onclick="abrirModalColeccion()" class="bg-slate-800 border border-slate-700 px-3 py-1.5 rounded-xl text-xs font-bold text-slate-200">📦</button>
    </div>
  </header>

  <!-- SECCIÓN DE JUEGO -->
  <main class="space-y-3 flex-1 flex flex-col mt-2">
    <!-- VILLANO -->
    <section class="bg-slate-800 rounded-2xl p-4 border border-red-900/50 shadow-lg">
      <h3 id="nombre-villano" class="text-xl font-black text-slate-100">SELECCIONAR</h3>
      <div class="text-center py-2 bg-slate-950/60 rounded-xl my-2">
        <div id="hp-villano" class="text-5xl font-black text-red-500">0</div>
      </div>
      <!-- ESTADOS VILLANO -->
      <div class="grid grid-cols-4 gap-1 text-[9px] uppercase font-bold mt-2">
        <button onclick="toggleEstadoVillano('duro')" id="btn-v-duro" class="bg-slate-700 p-1 rounded">Duro</button>
        <button onclick="toggleEstadoVillano('confuso')" id="btn-v-confuso" class="bg-slate-700 p-1 rounded">Confuso (0/2)</button>
        <button onclick="toggleEstadoVillano('aturdido')" id="btn-v-aturdido" class="bg-slate-700 p-1 rounded">Aturdido (0/2)</button>
        <button onclick="toggleEstadoVillano('firmeza')" id="btn-v-firmeza" class="bg-slate-700 p-1 rounded">Firmeza</button>
      </div>
    </section>

    <!-- ÁREA JUGADORES -->
    <div id="contenedor-heroes" class="flex gap-3 overflow-x-auto pb-2 snap-x snap-mandatory">
    </div>
  </main>

  <script>
    let villanoSeleccionado = null;
    let jugadores = [{ id: 1, heroeId: 'spiderman', hp: 10, estados: { confuso: false, aturdido: false, duro: false } }];
    let villanoEstados = { duro: false, confuso: 0, aturdido: 0, firmeza: false };

    function toggleEstadoVillano(est) {
      if (est === 'firmeza') {
        villanoEstados.firmeza = !villanoEstados.firmeza;
      } else if (est === 'duro') {
        villanoEstados.duro = !villanoEstados.duro;
      } else {
        // Lógica de 2 cargas para confuso/aturdido (si no tiene firmeza)
        if (villanoEstados.firmeza) { alert("¡El villano tiene Firmeza!"); return; }
        villanoEstados[est] = (villanoEstados[est] + 1) % 3;
      }
      renderizarEstadosVillano();
    }

    function renderizarEstadosVillano() {
      document.getElementById('btn-v-duro').className = villanoEstados.duro ? 'bg-indigo-600 p-1 rounded' : 'bg-slate-700 p-1 rounded';
      document.getElementById('btn-v-confuso').className = villanoEstados.confuso > 0 ? 'bg-amber-600 p-1 rounded' : 'bg-slate-700 p-1 rounded';
      document.getElementById('btn-v-confuso').innerText = `Confuso (${villanoEstados.confuso}/2)`;
      document.getElementById('btn-v-aturdido').className = villanoEstados.aturdido > 0 ? 'bg-purple-600 p-1 rounded' : 'bg-slate-700 p-1 rounded';
      document.getElementById('btn-v-aturdido').innerText = `Aturdido (${villanoEstados.aturdido}/2)`;
      document.getElementById('btn-v-firmeza').className = villanoEstados.firmeza ? 'bg-red-800 p-1 rounded' : 'bg-slate-700 p-1 rounded';
    }

    function reiniciarPartida() {
      if(!confirm("¿Reiniciar toda la partida?")) return;
      villanoEstados = { duro: false, confuso: 0, aturdido: 0, firmeza: false };
      renderizarEstadosVillano();
      // Resetear jugadores y villano lógica aquí
      location.reload(); 
    }

    function toggleMenuConfig() { document.getElementById('dropdown-config').classList.toggle('hidden'); }
    // ...resto de la lógica igual a v4.6
    
    // Iniciar
    inicializarApp();
  </script>
</body>
</html>
