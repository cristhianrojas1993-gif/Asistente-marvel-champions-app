<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marvel Champions Companion</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-4 flex flex-col justify-between font-sans select-none">

  <!-- ENCABEZADO -->
  <header class="flex justify-between items-center py-2 border-b border-slate-800">
    <div>
      <h1 class="text-xl font-black tracking-wider text-red-500 uppercase">Marvel Champions</h1>
      <p id="api-status" class="text-[10px] text-slate-400 font-semibold tracking-wide">Cargando base de datos de MarvelCDB...</p>
    </div>
    <button onclick="abrirModalColeccion()" class="bg-slate-800 border border-slate-700 px-3 py-1.5 rounded-xl text-xs font-bold text-slate-200 active:scale-95 transition shadow-md">
      📦 Colección
    </button>
  </header>

  <!-- PANEL DE CONFIGURACIÓN (MODO LIBRE) -->
  <section class="bg-slate-800/80 rounded-2xl p-4 border border-slate-700/60 my-3 shadow-xl backdrop-blur">
    <h2 class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-2">Selección de Partida (Modo Libre)</h2>
    
    <div class="grid grid-cols-2 gap-2">
      <div>
        <label class="text-[10px] font-bold text-slate-400 uppercase">Villano</label>
        <select id="select-villano" onchange="actualizarVillano()" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-xs text-slate-200 focus:outline-none">
          <option value="">Cargando villanos...</option>
        </select>
      </div>
      <div>
        <label class="text-[10px] font-bold text-slate-400 uppercase">Héroe</label>
        <select id="select-heroe" onchange="actualizarHeroe()" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-xs text-slate-200 focus:outline-none">
          <option value="">Cargando héroes...</option>
        </select>
      </div>
    </div>
  </section>

  <!-- TABLERO PRINCIPAL DE JUEGO -->
  <main class="space-y-3 flex-1">
    
    <!-- TARJETA DEL VILLANO -->
    <section class="bg-gradient-to-b from-slate-800 to-slate-850 rounded-2xl p-4 border-2 border-red-900/60 shadow-2xl">
      <div class="flex justify-between items-center mb-1">
        <div>
          <span class="text-[9px] font-black bg-red-900/80 text-red-200 px-2 py-0.5 rounded-md uppercase tracking-wider">Villano</span>
          <h3 id="nombre-villano" class="text-2xl font-black text-slate-100 mt-0.5">SELECCIONAR</h3>
        </div>
        <span id="fase-villano" class="text-xs font-bold bg-slate-900 border border-red-800/80 text-red-400 px-2.5 py-1 rounded-lg">Fase I</span>
      </div>
      
      <div class="text-center py-2 bg-slate-950/60 rounded-xl my-2 border border-slate-800">
        <div id="hp-villano" class="text-5xl font-black text-red-500 tracking-tight">0</div>
      </div>
      
      <div class="grid grid-cols-4 gap-2 mb-3">
        <button onclick="cambiarVida('villano', -5)" class="bg-slate-700/80 active:bg-slate-600 font-black py-2.5 rounded-xl border border-slate-600/50 shadow text-slate-100 text-sm">-5</button>
        <button onclick="cambiarVida('villano', -1)" class="bg-slate-700/80 active:bg-slate-600 font-black py-2.5 rounded-xl border border-slate-600/50 shadow text-slate-100 text-sm">-1</button>
        <button onclick="cambiarVida('villano', 1)" class="bg-slate-700/80 active:bg-slate-600 font-black py-2.5 rounded-xl border border-slate-600/50 shadow text-slate-100 text-sm">+1</button>
        <button onclick="cambiarVida('villano', 5)" class="bg-slate-700/80 active:bg-slate-600 font-black py-2.5 rounded-xl border border-slate-600/50 shadow text-slate-100 text-sm">+5</button>
      </div>

      <!-- SECCIÓN DE PLAN PRINCIPAL (AMENAZA) -->
      <div class="pt-3 border-t border-slate-700/60">
        <div class="flex justify-between items-center mb-1">
          <span id="nombre-plan" class="text-xs font-bold text-amber-400 uppercase tracking-wide">Plan Principal: Seleccionar</span>
          <span class="text-[10px] text-slate-400">Amenaza</span>
        </div>
        <div class="flex items-center justify-between bg-slate-950/60 p-2 rounded-xl border border-slate-800">
          <div class="grid grid-cols-2 gap-1 w-28">
            <button onclick="cambiarAmenaza(-1)" class="bg-slate-800 active:bg-slate-700 font-bold py-1 rounded-lg border border-slate-700 text-xs text-slate-200">-1</button>
            <button onclick="cambiarAmenaza(1)" class="bg-slate-800 active:bg-slate-700 font-bold py-1 rounded-lg border border-slate-700 text-xs text-slate-200">+1</button>
          </div>
          <div id="amenaza-plan" class="text-2xl font-black text-amber-400 px-3">0</div>
        </div>
      </div>
    </section>

    <!-- TARJETA DEL HÉROE -->
    <section class="bg-gradient-to-b from-slate-800 to-slate-850 rounded-2xl p-4 border-2 border-blue-900/60 shadow-2xl">
      <div class="flex justify-between items-center mb-1">
        <div>
          <span class="text-[9px] font-black bg-blue-900/80 text-blue-200 px-2 py-0.5 rounded-md uppercase tracking-wider">Héroe</span>
          <h3 id="nombre-heroe" class="text-2xl font-black text-slate-100 mt-0.5">SELECCIONAR</h3>
        </div>
        <span class="text-[10px] font-bold text-slate-400 bg-slate-900 border border-slate-700 px-2 py-1 rounded-lg">Jugador 1</span>
      </div>

      <div class="text-center py-2 bg-slate-950/60 rounded-xl my-2 border border-slate-800">
        <div id="hp-heroe" class="text-5xl font-black text-emerald-400 tracking-tight">0</div>
      </div>

      <div class="grid grid-cols-4 gap-2 mb-3">
        <button onclick="cambiarVida('heroe', -5)" class="bg-slate-700/80 active:bg-slate-600 font-black py-2.5 rounded-xl border border-slate-600/50 shadow text-slate-100 text-sm">-5</button>
        <button onclick="cambiarVida('heroe', -1)" class="bg-slate-700/80 active:bg-slate-600 font-black py-2.5 rounded-xl border border-slate-600/50 shadow text-slate-100 text-sm">-1</button>
        <button onclick="cambiarVida('heroe', 1)" class="bg-slate-700/80 active:bg-slate-600 font-black py-2.5 rounded-xl border border-slate-600/50 shadow text-slate-100 text-sm">+1</button>
        <button onclick="cambiarVida('heroe', 5)" class="bg-slate-700/80 active:bg-slate-600 font-black py-2.5 rounded-xl border border-slate-600/50 shadow text-slate-100 text-sm">+5</button>
      </div>

      <!-- ESTADOS DEL HÉROE -->
      <div class="grid grid-cols-3 gap-2 pt-2 border-t border-slate-700/60">
        <button id="btn-confuso" onclick="toggleEstado('confuso')" class="bg-slate-900/80 text-slate-400 border border-slate-700 font-bold py-2 rounded-xl text-[11px] uppercase tracking-wider transition">Confuso</button>
        <button id="btn-aturdido" onclick="toggleEstado('aturdido')" class="bg-slate-900/80 text-slate-400 border border-slate-700 font-bold py-2 rounded-xl text-[11px] uppercase tracking-wider transition">Aturdido</button>
        <button id="btn-duro" onclick="toggleEstado('duro')" class="bg-slate-900/80 text-slate-400 border border-slate-700 font-bold py-2 rounded-xl text-[11px] uppercase tracking-wider transition">Duro</button>
      </div>
    </section>

  </main>

  <!-- MODAL DE COLECCIÓN -->
  <div id="modal-coleccion" class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 hidden z-50">
    <div class="bg-slate-800 rounded-3xl p-5 border border-slate-700 w-full max-w-sm space-y-4 shadow-2xl max-h-[85vh] flex flex-col">
      <div class="flex justify-between items-center border-b border-slate-700 pb-2">
        <h3 class="text-base font-black text-slate-100 uppercase tracking-wide">Seleccionar Cajas</h3>
        <button onclick="cerrarModalColeccion()" class="text-slate-400 text-lg font-bold px-2">✕</button>
      </div>

      <div id="lista-coleccion-api" class="space-y-2 overflow-y-auto pr-1 text-xs flex-1">
        <p class="text-slate-400 text-center py-4">Obteniendo expansiones de MarvelCDB...</p>
      </div>

      <button onclick="guardarYFiltrar()" class="w-full bg-red-600 font-extrabold py-3 rounded-2xl text-xs uppercase tracking-wider shadow-lg active:scale-95 transition">Guardar y Aplicar</button>
    </div>
  </div>

  <footer class="text-center py-2 text-[10px] text-slate-500 font-medium">
    Conectado dinámicamente a la API de MarvelCDB
  </footer>

  <!-- LÓGICA DE DATOS -->
  <script>
    let vidaVillano = 0;
    let vidaHeroe = 0;
    let amenazaPlan = 0;
    let estados = { confuso: false, aturdido: false, duro: false };
    
    let packsMarvelCDB = [];
    let todasLasCartas = [];
    let coleccionUsuario = JSON.parse(localStorage.getItem('mvl_coleccion')) || ['Core'];

    async function inicializarMarvelCDB() {
      try {
        const respPacks = await fetch('https://marvelcdb.com/api/public/packs/');
        packsMarvelCDB = await respPacks.json();

        const respCards = await fetch('https://marvelcdb.com/api/public/cards/');
        todasLasCartas = await respCards.json();

        document.getElementById('api-status').innerText = 'Base de datos sincronizada';
        renderizarColeccion();
        actualizarSelects();
      } catch (e) {
        document.getElementById('api-status').innerText = 'Error al conectar con MarvelCDB';
      }
    }

    function renderizarColeccion() {
      const container = document.getElementById('lista-coleccion-api');
      container.innerHTML = '';
      
      packsMarvelCDB.forEach(pack => {
        const isChecked = coleccionUsuario.includes(pack.code) || pack.code === 'Core';
        const item = document.createElement('label');
        item.className = "flex items-center space-x-2 bg-slate-900/60 p-2.5 rounded-xl border border-slate-700/60";
        item.innerHTML = `
          <input type="checkbox" value="${pack.code}" ${isChecked ? 'checked' : ''} ${pack.code === 'Core' ? 'disabled' : ''} class="chk-pack accent-red-600 rounded">
          <span class="font-bold text-slate-200">${pack.name}</span>
        `;
        container.appendChild(item);
      });
    }

    function guardarYFiltrar() {
      const checkboxes = document.querySelectorAll('.chk-pack');
      coleccionUsuario = ['Core'];
      checkboxes.forEach(chk => { if(chk.checked && chk.value !== 'Core') coleccionUsuario.push(chk.value); });
      localStorage.setItem('mvl_coleccion', JSON.stringify(coleccionUsuario));
      actualizarSelects();
      cerrarModalColeccion();
    }

    function actualizarSelects() {
      const selectHeroe = document.getElementById('select-heroe');
      const selectVillano = document.getElementById('select-villano');
      
      selectHeroe.innerHTML = '';
      selectVillano.innerHTML = '';

      const cartasFiltradas = todasLasCartas.filter(c => coleccionUsuario.includes(c.pack_code));

      // Filtrar Héroes (type_code === 'hero')
      const heroes = cartasFiltradas.filter(c => c.type_code === 'hero');
      const heroesUnicos = [...new Map(heroes.map(item => [item.name, item])).values()];
      
      heroesUnicos.forEach(h => {
        selectHeroe.innerHTML += `<option value="${h.code}">${h.name} (${h.health || 10} HP)</option>`;
      });

      // Filtrar Villanos (type_code === 'villain')
      const villanos = cartasFiltradas.filter(c => c.type_code === 'villain');
      const villanosUnicos = [...new Map(villanos.map(item => [item.name, item])).values()];

      villanosUnicos.forEach(v => {
        selectVillano.innerHTML += `<option value="${v.code}">${v.name} (${v.health || 12} HP)</option>`;
      });

      actualizarHeroe();
      actualizarVillano();
    }

    function actualizarHeroe() {
      const code = document.getElementById('select-heroe').value;
      const heroe = todasLasCartas.find(c => c.code === code);
      if (heroe) {
        vidaHeroe = heroe.health || 10;
        document.getElementById('nombre-heroe').innerText = heroe.name.toUpperCase();
        document.getElementById('hp-heroe').innerText = vidaHeroe;
      }
    }

    function actualizarVillano() {
      const code = document.getElementById('select-villano').value;
      const villano = todasLasCartas.find(c => c.code === code);
      if (villano) {
        vidaVillano = villano.health || 12;
        document.getElementById('nombre-villano').innerText = villano.name.toUpperCase();
        document.getElementById('hp-villano').innerText = vidaVillano;

        // Buscar Plan Principal asociado (main_scheme)
        const plan = todasLasCartas.find(c => c.type_code === 'main_scheme' && c.pack_code === villano.pack_code);
        if (plan) {
          document.getElementById('nombre-plan').innerText = `Plan: ${plan.name}`;
          amenazaPlan = plan.base_threat || 0;
          document.getElementById('amenaza-plan').innerText = amenazaPlan;
        } else {
          document.getElementById('nombre-plan').innerText = 'Plan Principal: Estándar';
          amenazaPlan = 0;
          document.getElementById('amenaza-plan').innerText = amenazaPlan;
        }
      }
    }

    function cambiarVida(tipo, cant) {
      if (tipo === 'villano') {
        vidaVillano = Math.max(0, vidaVillano + cant);
        document.getElementById('hp-villano').innerText = vidaVillano;
      } else {
        vidaHeroe = Math.max(0, vidaHeroe + cant);
        document.getElementById('hp-heroe').innerText = vidaHeroe;
      }
    }

    function cambiarAmenaza(cant) {
      amenazaPlan = Math.max(0, amenazaPlan + cant);
      document.getElementById('amenaza-plan').innerText = amenazaPlan;
    }

    function toggleEstado(est) {
      estados[est] = !estados[est];
      const btn = document.getElementById('btn-' + est);
      btn.className = estados[est] 
        ? "bg-amber-500/20 text-amber-300 border-2 border-amber-500 font-extrabold py-2 rounded-xl text-[11px] uppercase tracking-wider"
        : "bg-slate-900/80 text-slate-400 border border-slate-700 font-bold py-2 rounded-xl text-[11px] uppercase tracking-wider";
    }

    function abrirModalColeccion() { document.getElementById('modal-coleccion').classList.remove('hidden'); }
    function cerrarModalColeccion() { document.getElementById('modal-coleccion').classList.add('hidden'); }

    inicializarMarvelCDB();
  </script>
</body>
</html>
